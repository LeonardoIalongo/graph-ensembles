[project]
name = "graph-ensembles"
version = "0.4.0"
description = "The graph ensemble package contains a set of methods to build fitness based graph ensembles from marginal information."
readme = "README.rst"
license = { text = "GNU General Public License v3" }
authors = [
    { name = "Leonardo Niccolò Ialongo", email = "leonardo.ialongo@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "jax>=0.9.2",
    "networkx>=3.6.1",
    "numba>=0.64.0",
    "numpy>=2.4.3",
]

[project.urls]
Homepage = "https://github.com/LeonardoIalongo/graph-ensembles"


[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pandas>=3.0.1",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
